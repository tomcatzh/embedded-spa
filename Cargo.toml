[package]
name = "embedded-spa"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Cache-correct Axum responses for rust-embed SPAs with precompressed representations"
readme = "README.md"
license = "MIT"
repository = "https://github.com/tomcatzh/embedded-spa"
homepage = "https://github.com/tomcatzh/embedded-spa"
documentation = "https://docs.rs/embedded-spa"
keywords = ["axum", "spa", "rust-embed", "etag", "brotli"]
categories = ["web-programming::http-server"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/Makefile",
    "/src/**",
    "/examples/**",
    "/scripts/**",
    "/tests/**",
    "/llms.txt",
]

[features]
default = []
live-assets = []

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["deterministic-timestamps"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[package.metadata.docs.rs]
all-features = true
